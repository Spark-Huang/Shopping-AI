name: Shopping AI CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose -f ops/compose.yaml config --quiet

  service-images:
    name: Build service images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build images
        run: docker compose -f ops/compose.yaml build orchestrator search memory safety web
