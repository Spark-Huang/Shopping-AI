# Configuration override for a hosted OpenAI-compatible API gateway.
# Optional safety override. Apply with CONFIG_OVERRIDE=config-build.yaml and
# SAFETY_API_KEY set in .env. This file intentionally lives outside the base
# safety directory so NeMo Guardrails does not load it automatically.
# The gateway base URL is read by the safety service from SAFETY_BASE_URL
# (default http://llm-gateway:8000/v1).
models:
  - type: main
    engine: openai
    model: "set-me"
    parameters:
      base_url: "http://llm-gateway:8000/v1"
  - type: content_safety
    engine: openai
    model: "set-me"
    parameters:
      base_url: "http://llm-gateway:8000/v1"
  - type: topic_control
    engine: openai
    model: "set-me"
    parameters:
      base_url: "http://llm-gateway:8000/v1"
