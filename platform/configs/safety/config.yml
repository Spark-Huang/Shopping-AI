models:
  - type: main
    engine: openai
    model: zai/glm-5.3

  - type: content_safety
    engine: openai
    model: zai/glm-5.3

  - type: topic_control
    engine: openai
    model: zai/glm-5.3

bot_messages:
  refuse to respond: 
    - "抱歉，我是贵客来，专注贵州的商品与服务选购。我可以帮你挑选贵州食品、茶饮、非遗手作、伴手礼，或查询景点门票。"

rails:
  input:
    flows:
      - content safety check input $model=content_safety
      - topic safety check input $model=topic_control
  output:
    flows:
      - content safety check output $model=content_safety
    streaming:
      chunk_size: 200
      context_size: 50

tracing:
  enabled: True
  adapters:
    - name: FileSystem
      filepath: './traces/traces.jsonl'
