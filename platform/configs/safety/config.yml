models:
  - type: main
    engine: openai
    model: openrouter/stealth/ox-alpha

  - type: content_safety
    engine: openai
    model: openrouter/stealth/ox-alpha

  - type: topic_control
    engine: openai
    model: openrouter/stealth/ox-alpha

bot_messages:
  refuse to respond: 
    - "抱歉，贵客来专注于贵州特色商品选购。我可以继续帮你挑选贵州食品、茶饮、非遗手作和伴手礼。"

rails:
  input:
    flows:
      - content safety check input $model=content_safety
      - topic safety check input $model=topic_control
  output:
    flows:
      - content safety check output $model=content_safety
    streaming:
      chunk_size: 200
      context_size: 50

tracing:
  enabled: True
  adapters:
    - name: FileSystem
      filepath: './traces/traces.jsonl'
