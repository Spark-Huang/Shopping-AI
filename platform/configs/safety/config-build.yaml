# Configuration override for a hosted OpenAI-compatible API gateway.
# Apply with CONFIG_OVERRIDE=config-build.yaml and SAFETY_API_KEY set in .env.
# The gateway base URL is read by the safety service from SAFETY_BASE_URL
# (default http://llm-gateway:8000/v1).
models:
  - type: main
    engine: openai
    model: "set-me"
    parameters:
      base_url: "http://llm-gateway:8000/v1"
  - type: content_safety
    engine: openai
    model: "set-me"
    parameters:
      base_url: "http://llm-gateway:8000/v1"
  - type: topic_control
    engine: openai
    model: "set-me"
    parameters:
      base_url: "http://llm-gateway:8000/v1"
