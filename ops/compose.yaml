services:
  orchestrator:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-omniroute-local}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-gateway:8000/v1}
      LLM_NAME: ${LLM_NAME:-openrouter/stealth/ox-alpha}
      SAFETY_BASE_URL: http://safety:8012
      JWT_SECRET: ${JWT_SECRET:-shopping-ai-dev-secret}
      CONFIG_OVERRIDE: ${CONFIG_OVERRIDE:-}
    ports:
      - "8009:8009"
    depends_on:
      - search
      - memory
      - safety
    networks:
      - shopping-ai

  search:
    build:
      context: ..
      dockerfile: search/Dockerfile
    environment:
      EMBED_API_KEY: ${EMBED_API_KEY:-omniroute-local}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-${LLM_BASE_URL:-http://llm-gateway:8000/v1}}
      EMBED_NAME: ${EMBED_NAME:-gemini/gemini-embedding-001}
      IMAGE_MODEL_NAME: ${IMAGE_MODEL_NAME:-}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      CONFIG_OVERRIDE: ${CONFIG_OVERRIDE:-}
    ports:
      - "8010:8010"
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - shopping-ai

  memory:
    build:
      context: ../memory
    environment:
      MEMORY_DATABASE_URL: sqlite:////data/context.db
      JWT_SECRET: ${JWT_SECRET:-shopping-ai-dev-secret}
      MEMORY_EMBEDDING_ENABLED: ${MEMORY_EMBEDDING_ENABLED:-true}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MEMORY_COGNEE_DATASET: ${MEMORY_COGNEE_DATASET:-shopping_ai_memory}
      LLM_API_KEY: ${LLM_API_KEY:-omniroute-local}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-gateway:8000/v1}
      LLM_NAME: ${LLM_NAME:-openrouter/stealth/ox-alpha}
      EMBED_API_KEY: ${EMBED_API_KEY:-omniroute-local}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-${LLM_BASE_URL:-http://llm-gateway:8000/v1}}
      EMBED_NAME: ${EMBED_NAME:-gemini/gemini-embedding-001}
    volumes:
      - memory-data:/data
    ports:
      - "8011:8011"
    networks:
      - shopping-ai
    depends_on:
      milvus:
        condition: service_healthy

  safety:
    build:
      context: ..
      dockerfile: safety/Dockerfile
    environment:
      SAFETY_API_KEY: ${SAFETY_API_KEY:-omniroute-local}
      SAFETY_BASE_URL: ${SAFETY_BASE_URL:-${LLM_BASE_URL:-http://llm-gateway:8000/v1}}
      CONFIG_OVERRIDE: ${CONFIG_OVERRIDE:-}
    ports:
      - "8012:8012"
    networks:
      - shopping-ai

  web:
    build:
      context: ../web
    environment:
      REACT_APP_API_BASE_URL: /api
    depends_on:
      - orchestrator
    networks:
      - shopping-ai

  nginx:
    image: nginx:1.27.4-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - orchestrator
    networks:
      - shopping-ai

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shopping-ai

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shopping-ai

  milvus:
    image: milvusdb/milvus:v2.4.13-hotfix
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: http://etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - shopping-ai

networks:
  shopping-ai:
    driver: bridge

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  memory-data:
